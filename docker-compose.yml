services:

  # ── PostgreSQL ─────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: medplatform_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: meddb
      POSTGRES_USER: meduser
      POSTGRES_PASSWORD: medpass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meduser -d meddb"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis (Celery broker + result backend) ─────
  redis:
    image: redis:7-alpine
    container_name: medplatform_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── FastAPI app ────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    container_name: medplatform_api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/api          # hot-reload in dev
      - uploads_data:/api/uploads
      - preprocessed_data:/api/preprocessed
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Celery worker ──────────────────────────────
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    container_name: medplatform_worker
    restart: unless-stopped
    command: celery -A app.worker worker --loglevel=info --concurrency=2
    env_file:
      - .env
    volumes:
      - ./backend:/api
      - uploads_data:/api/uploads
      - preprocessed_data:/api/preprocessed
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
  preprocessed_data:
  reports_data:

  # ── React Dashboard (Vite dev server) ──────────────────────────────
  frontend:
    image: node:20-alpine
    container_name: medscan_frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://api:8000
    depends_on:
      - api
